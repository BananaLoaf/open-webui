	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}
		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}
		#splash-screen {
			--innomait-enter-ease: cubic-bezier(0.16, 1, 0.3, 1);
			background: var(--ow-canvas);
			color: var(--ow-text);
		}

		#splash-screen #logo {
			position: absolute;
			top: 44%;
			left: 50%;
			width: min(24rem, calc(100vw - 2rem));
			height: 6rem;
			transform: translateX(-50%);
		}

		#splash-screen .splash-her-content {
			position: absolute;
			top: 33%;
			left: 50%;
			display: flex;
			flex-direction: column;
			align-items: center;
			width: min(24rem, calc(100vw - 2rem));
			transform: translateX(-50%);
		}

		#splash-screen #logo-her {
			display: none;
			width: 100%;
			height: 13rem;
		}

		html.her #splash-screen #logo {
			display: none;
		}
		html.her #splash-screen #logo-her {
			display: block;
		}

		#splash-screen .innomait-logo {
			display: block;
			width: 100%;
			height: 100%;
			overflow: visible;
		}

		#splash-screen .innomait-core {
			animation: innomait-core-enter 380ms var(--innomait-enter-ease) both;
		}

		#splash-screen .innomait-top {
			animation: innomait-top-enter 360ms var(--innomait-enter-ease) 60ms both;
		}

		#splash-screen .innomait-bottom {
			animation: innomait-bottom-enter 360ms var(--innomait-enter-ease) 100ms both;
		}

		#splash-screen .innomait-word {
			animation: innomait-word-enter 380ms var(--innomait-enter-ease) 180ms both;
		}

		#splash-screen .innomait-word-mask {
			transform-box: fill-box;
			transform-origin: left center;
			animation: innomait-word-reveal 440ms var(--innomait-enter-ease) 180ms both;
		}

		@keyframes innomait-core-enter {
			from {
				opacity: 0;
				transform: translate(-20px, 20px);
			}
			to {
				opacity: 1;
				transform: translate(0, 0);
			}
		}

		@keyframes innomait-top-enter {
			from {
				opacity: 0;
				transform: translate(-24px, -18px);
			}
			to {
				opacity: 1;
				transform: translate(0, 0);
			}
		}

		@keyframes innomait-bottom-enter {
			from {
				opacity: 0;
				transform: translate(24px, 18px);
			}
			to {
				opacity: 1;
				transform: translate(0, 0);
			}
		}

		@keyframes innomait-word-enter {
			from {
				opacity: 0;
				transform: translateX(12px);
			}
			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		@keyframes innomait-word-reveal {
			from {
				transform: scaleX(0);
			}
			to {
				transform: scaleX(1);
			}
		}

		@keyframes innomait-logo-pulse {
			0%,
			100% {
				opacity: 1;
			}
			50% {
				opacity: 0.65;
			}
		}

		html.her #splash-screen #logo-her .innomait-lockup {
			animation: innomait-logo-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) 820ms infinite;
		}

		#splash-screen .splash-progress-track {
			position: relative;
			width: 100%;
			height: 0.75rem;
			margin-top: 0.5rem;
		}

		#splash-screen #progress-background,
		#splash-screen #progress-bar {
			display: none;
			position: absolute;
			height: 0.75rem;
			border-radius: 9999px;
		}

		#splash-screen #progress-background {
			width: 100%;
			background: var(--ow-border);
		}
		#splash-screen #progress-bar {
			width: 0%;
			background: var(--ow-accent);
		}

		html.her #splash-screen #progress-background,
		html.her #splash-screen #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #splash-screen #progress-background,
			html.her #splash-screen #progress-bar {
				display: none;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			#splash-screen .innomait-logo * {
				animation: none !important;
				opacity: 1;
				transform: none;
			}
		}
	</style>
